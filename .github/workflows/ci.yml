name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # PyQt6 links against these at import time. Tesseract is not needed:
      # tests/unit is pure and never shells out to it.
      - name: Install system libraries for PyQt6
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff mypy

      - name: Ruff lint
        run: ruff check .

      - name: Mypy (incrementally typed modules)
        run: mypy src/attention/coordinates.py src/lesson_validator.py

      - name: Pytest
        # No display on the runner; Qt uses its offscreen platform plugin.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest
